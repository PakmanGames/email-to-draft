# A fixed project name makes every git worktree share this one container,
# so parallel checkouts never fight over port 5432.
name: email-to-draft

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: rfq
      POSTGRES_PASSWORD: rfq
      POSTGRES_DB: rfq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfq -d rfq"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
